version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    # typescript-eslint currently requires TypeScript >=4.8.4 <6.1.0.
    # Remove this restriction when its peer dependency supports newer versions.
    ignore:
      - dependency-name: typescript
        versions: ['>=6.1.0']
    # Majors are kept apart so that one breaking package can't block the
    # minor and patch updates, which are merged automatically.
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
      npm-major:
        update-types:
          - major
