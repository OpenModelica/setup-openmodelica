# `dist/index.js` is a special file in Actions.
# When you reference an action with `uses:` in a workflow,
# `index.js` is the code that will run.
# For our project, we generate this file through a build process from other source files.
# We need to make sure the checked-in `index.js` actually matches what we expect it to be.
#
# Installing and building runs code from our dependencies, so this is split
# into two jobs:
#   - build-dist installs and builds with a read-only token.
#   - check-dist is the required check. It never installs or runs anything
#     from the PR. On a pull_request from a branch of this repository
#     (including Dependabot's) it commits the dist/ built by build-dist back
#     to the PR branch. In all other cases (fork PR, push to main) a mismatch
#     fails, and the expected dist/ is available as a workflow artifact.
#
# The push uses a GitHub App token, because GITHUB_TOKEN pushes don't trigger
# new workflow runs and the PR would never get its required checks. The App's
# client ID and private key must be set as both Actions and Dependabot secrets
# (DIST_BOT_CLIENT_ID, DIST_BOT_PRIVATE_KEY), since Dependabot's runs only get
# the latter.
name: Check dist/

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild the dist/ directory
        run: npm run package

      - name: Compare the expected and actual dist/ directories
        id: diff
        run: |
          if [ "$(git diff --ignore-space-at-eol dist/ | wc -l)" -gt "0" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Detected uncommitted changes after build.  See status below:"
            git diff --ignore-space-at-eol dist/
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.diff.outputs.changed == 'true'
        with:
          name: dist
          path: dist/

  # always(): a skipped job would count as passing the required check.
  check-dist:
    needs: build-dist
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BUILD_RESULT: ${{ needs.build-dist.result }}
      DIST_CHANGED: ${{ needs.build-dist.outputs.changed }}
      CAN_PUSH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
      HEAD_REF: ${{ github.head_ref }}

    steps:
      - name: Evaluate the build result
        run: |
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "::error::Building dist/ failed, see the build-dist job."
            exit 1
          fi
          if [ "$DIST_CHANGED" = "true" ] && [ "$CAN_PUSH" != "true" ]; then
            echo "::error::dist/ does not match the build output and could not be auto-committed. Run 'npm run package' locally and commit the result."
            exit 1
          fi

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: env.DIST_CHANGED == 'true'
        with:
          client-id: ${{ secrets.DIST_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DIST_BOT_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.DIST_CHANGED == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Remove the outdated dist/ directory
        if: env.DIST_CHANGED == 'true'
        run: rm -rf dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.DIST_CHANGED == 'true'
        with:
          name: dist
          path: dist/

      # This push triggers a new run, so stop if the last rebuild didn't settle
      # dist/ instead of pushing forever.
      - name: Commit dist/ fix to PR branch
        if: env.DIST_CHANGED == 'true'
        run: |
          if [ "$(git log -1 --format=%s)" = "Rebuild dist/" ]; then
            echo "::error::dist/ still differs after being rebuilt. Is the build deterministic?"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          git commit -m "Rebuild dist/"
          git push origin "HEAD:refs/heads/$HEAD_REF"
