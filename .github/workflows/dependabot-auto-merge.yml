# Enables auto-merge on Dependabot's minor and patch updates, so they are
# squash-merged once the checks required by the ruleset on main have passed.
# Major updates, and any PR someone else has pushed to, are left for review.
#
# Merging doesn't publish anything: users only get the update once a release
# tag is moved. Note that merges made with GITHUB_TOKEN don't trigger the
# `push` workflows on main.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: read

jobs:
  enable-auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
